{% load static %}
<div class="comments-section mt-4 border-t pt-4">
    <h4 class="font-semibold text-gray-900 mb-3">Comments ({{ comments|length }})</h4>
    
    {% for comment in comments %}
        <div class="comment-item bg-gray-50 rounded-lg p-3 mb-2">
            <div class="flex items-start justify-between">
                <div class="flex-1">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="font-medium text-gray-900">{{ comment.name }}</span>
                        <span class="text-xs text-gray-400">{{ comment.created_at|date:"M d, Y" }}</span>
                    </div>
                    <p class="text-gray-700 text-sm">{{ comment.content }}</p>
                </div>
            </div>
        </div>
    {% empty %}
        <p class="text-gray-500 text-sm italic">No comments yet. Be the first to comment!</p>
    {% endfor %}
</div>
